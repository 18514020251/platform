application:
  version: ${APP_VERSION:1.0.0}

server:
  port: ${KNOWLEDGE_SERVICE_PORT:8083}

spring:
  application:
    name: platform-knowledge-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/platform_knowledge?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/platform_log}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}
    connection-timeout: 5s
    socket-timeout: 30s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

sa-token:
  token-name: Authorization
  timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid

platform:
  remote:
    ai-base-url: ${AI_SERVICE_URL:http://localhost:8084}

  internal:
    token: ${PLATFORM_INTERNAL_TOKEN}

  access-log:
    enabled: true
    mongo-enabled: ${ACCESS_LOG_MONGO_ENABLED:true}
    collection-name: ${ACCESS_LOG_COLLECTION:platform_access_log}
    create-indexes: ${ACCESS_LOG_CREATE_INDEXES:true}
    ttl-days: ${ACCESS_LOG_TTL_DAYS:30}
    async-core-pool-size: ${ACCESS_LOG_ASYNC_CORE_POOL_SIZE:2}
    async-max-pool-size: ${ACCESS_LOG_ASYNC_MAX_POOL_SIZE:4}
    async-queue-capacity: ${ACCESS_LOG_ASYNC_QUEUE_CAPACITY:1000}
    async-thread-name-prefix: ${ACCESS_LOG_ASYNC_THREAD_NAME_PREFIX:access-log-}
    async-await-termination-seconds: ${ACCESS_LOG_ASYNC_AWAIT_TERMINATION_SECONDS:3}