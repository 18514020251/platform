application:
  version: ${APP_VERSION:1.0.0}

spring:
  application:
    name: platform-ai-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/platform_ai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: '${MYSQL_PASSWORD}'
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/platform_log}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

server:
  port: 8084

sa-token:
  token-name: Authorization
  timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid

langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_KEY}
      model-name: deepseek-chat
      base-url: https://api.deepseek.com
      log-requests: true
      log-responses: true

platform:
  access-log:
    enabled: true
    mongo-enabled: ${ACCESS_LOG_MONGO_ENABLED:true}
    collection-name: ${ACCESS_LOG_COLLECTION:platform_access_log}
    create-indexes: ${ACCESS_LOG_CREATE_INDEXES:true}
    ttl-days: ${ACCESS_LOG_TTL_DAYS:30}
    async-core-pool-size: ${ACCESS_LOG_ASYNC_CORE_POOL_SIZE:2}
    async-max-pool-size: ${ACCESS_LOG_ASYNC_MAX_POOL_SIZE:4}
    async-queue-capacity: ${ACCESS_LOG_ASYNC_QUEUE_CAPACITY:1000}
    async-thread-name-prefix: ${ACCESS_LOG_ASYNC_THREAD_NAME_PREFIX:access-log-}
    async-await-termination-seconds: ${ACCESS_LOG_ASYNC_AWAIT_TERMINATION_SECONDS:3}

  ai:
    embedding:
      dashscope:
        api-key: ${DASHSCOPE_API_KEY}
        model-name: text-embedding-v3

  remote:
    knowledge-base-url: http://localhost:8083
    workflow-base-url: http://localhost:8082
    ai-base-url: localhost:8085