application:
  version: ${APP_VERSION:1.0.0}

spring:
  application:
    name: platform-ai-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/platform_ai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: '${MYSQL_PASSWORD}'
    driver-class-name: com.mysql.cj.jdbc.Driver

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

server:
  port: 8084

sa-token:
  token-name: Authorization
  timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid

langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_KEY}
      model-name: deepseek-chat
      base-url: https://api.deepseek.com
      log-requests: true
      log-responses: true

platform:
  ai:
    embedding:
      dashscope:
        api-key: ${DASHSCOPE_API_KEY}
        model-name: text-embedding-v3

  remote:
    knowledge-base-url: http://localhost:8083
    workflow-base-url: http://localhost:8082
    ai-base-url: localhost:8085