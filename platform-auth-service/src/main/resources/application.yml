application:
  version: ${APP_VERSION:1.0.0}

server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: platform-auth-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/platform_auth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/platform_log}

    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5s

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

sa-token:
  token-name: Authorization
  timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid

platform:
  redis:
    health-check:
      enabled: true
      fail-fast: false

  access-log:
    enabled: true
    mongo-enabled: ${ACCESS_LOG_MONGO_ENABLED:true}
    collection-name: ${ACCESS_LOG_COLLECTION:platform_access_log}
    create-indexes: ${ACCESS_LOG_CREATE_INDEXES:true}
    ttl-days: ${ACCESS_LOG_TTL_DAYS:30}
    async-core-pool-size: ${ACCESS_LOG_ASYNC_CORE_POOL_SIZE:2}
    async-max-pool-size: ${ACCESS_LOG_ASYNC_MAX_POOL_SIZE:4}
    async-queue-capacity: ${ACCESS_LOG_ASYNC_QUEUE_CAPACITY:1000}
    async-thread-name-prefix: ${ACCESS_LOG_ASYNC_THREAD_NAME_PREFIX:access-log-}
    async-await-termination-seconds: ${ACCESS_LOG_ASYNC_AWAIT_TERMINATION_SECONDS:3}